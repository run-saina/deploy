name: Docker (CUDA)
# GPU image with Saina Helm 0.8B weights baked in, for GPU clouds such as RunPod.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (e.g. 0.1.2-cuda); also tagged latest-cuda
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-cuda-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/run-saina/saina-server
    steps:
      # The CUDA libraries and weights need more disk than a fresh runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cuda/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:latest-cuda
          labels: |
            org.opencontainers.image.source=https://github.com/run-saina/deploy
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Saina model server for NVIDIA GPUs with Saina Helm 0.8B weights baked in.
