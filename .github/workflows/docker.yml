name: Docker
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. 0.1.0); also tagged latest
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/run-saina/saina-server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Smoke test before pushing: the server and model loader must import.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: saina-server:ci
      - run: docker run --rm saina-server:ci python -c "import saina.server, saina.loader"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/run-saina/deploy
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Saina model server (POST /v1/ask), CPU. Model weights download at runtime.
